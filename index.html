<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Student Resources</title>
  <link rel="icon" href="https://www.microsoft.com/favicon.ico">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #ddd;
      background-color: #f5f5f5;
    }

    header img {
      height: 32px;
      margin-right: 10px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      margin: 0;
    }

    h2 {
      font-size: 20px;
      margin: 30px 0 20px;
      text-align: center;
    }

    button {
      background-color: #0078d4;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #005fa3;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 18px;
      }

      h2 {
        font-size: 18px;
        margin: 20px 0;
      }

      button {
        width: 100%;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft Logo">
    <h1>Microsoft Student Ambassador Links</h1>
  </header>

  <h2>🚀 Tap the button below to explore all Microsoft resources!</h2>
  <button onclick="openLinks()">Open All Links</button>

  <footer>
    © 2025 Microsoft Student Program – Curated by Subham Kumar Mallick
  </footer>

  <script>
    function openLinks() {
      const links = [
        "https://azure.microsoft.com?wt.mc_id=studentamb_466792",
        "https://blog.fabric.microsoft.com?wt.mc_id=studentamb_466792",
        "https://code.visualstudio.com?wt.mc_id=studentamb_466792",
        "https://community.fabric.microsoft.com?wt.mc_id=studentamb_466792",
        "https://devblogs.microsoft.com?wt.mc_id=studentamb_466792",
        "https://developer.microsoft.com?wt.mc_id=studentamb_466792",
        "https://dotnet.microsoft.com?wt.mc_id=studentamb_466792",
        "https://events.microsoft.com?wt.mc_id=studentamb_466792",
        "https://foundershub.startups.microsoft.com?wt.mc_id=studentamb_466792",
        "https://imaginecup.microsoft.com?wt.mc_id=studentamb_466792",
        "https://learn.microsoft.com?wt.mc_id=studentamb_466792",
        "https://learn.microsoft.com/copilot?wt.mc_id=studentamb_466792",
        "https://reactor.microsoft.com?wt.mc_id=studentamb_466792",
        "https://mvp.microsoft.com?wt.mc_id=studentamb_466792",
        "https://microsoft.com/microsoft-cloud/blog?wt.mc_id=studentamb_466792",
        "https://microsoft.com/microsoft-fabric?wt.mc_id=studentamb_466792",
        "https://microsoft.com/startups?wt.mc_id=studentamb_466792",
        "https://techcommunity.microsoft.com?wt.mc_id=studentamb_466792"
      ];
      links.forEach(link => window.open(link, '_blank'));
    }
  </script>

</body>
</html>
